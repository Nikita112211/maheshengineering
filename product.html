<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Mahesh Engineering Works</title>
<link rel="stylesheet" href="products.css">

</head>
<body>

<header class="navbar">
  <div class="logo-area">
    <img src="images/mahesh logo.png" class="logo-img">
    <div class="logo-text">
      <h1>MAHESH ENGINEERING WORKS</h1>
      <p>Steel Structures | PEB Solutions | Fabrication & Erection</p>
    </div>
  </div>

  <nav class="nav-menu">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT US</a>
    <a href="products.html" class="active">OUR PRODUCTS</a>
    <a href="contact.html">CONTACT US</a>
  </nav>
</header>

<section class="hero" id="detail-hero">
  <h1 id="detail-title">Product</h1>
  <p id="detail-short">Loading...</p>
</section>

<section class="product-detail" id="detail-container">
<!-- Filled in automatically by JS based on ?id= in the URL -->
</section>

<footer>
  <p>&copy; 2026 Mahesh Engineering Works</p>
</footer>

<script src="products-data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const product = PRODUCTS.find(p => p.id === id);

  const container = document.getElementById("detail-container");
  const titleEl = document.getElementById("detail-title");
  const shortEl = document.getElementById("detail-short");

  if (product) {
    document.title = product.title + " | Mahesh Engineering Works";
    titleEl.textContent = product.title;
    shortEl.textContent = product.shortDesc;

    const featuresHTML = product.features
      .map(f => `<li>${f}</li>`)
      .join("");

    container.innerHTML = `
      <div class="detail-card">
        <img src="${product.image}" alt="${product.title}" class="detail-img">
        <div class="detail-info">
          <h2>${product.title}</h2>
          <p>${product.fullDesc}</p>
          <h4>Key Features</h4>
          <ul class="feature-list">${featuresHTML}</ul>
          <a href="contact.html" class="enquire-btn">Enquire About This Product</a>
        </div>
      </div>
      <a href="products.html" class="back-link">&larr; Back to All Products</a>
    `;
  } else {
    titleEl.textContent = "Product Not Found";
    shortEl.textContent = "";
    container.innerHTML = `
      <p style="text-align:center; padding:40px 0;">
        Sorry, we couldn't find that product.
        <a href="products.html">Go back to Products</a>.
      </p>
    `;
  }
</script>

</body>
</html>
